name: Bug report
description: Report a crash, gameplay problem or graphics issue.
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v0.1.0-preview.1
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Japanese
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and how can it be reproduced?
      description: Include the mode, teams and steps leading to the problem.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System and graphics settings
      description: Windows version, CPU, GPU, output resolution and rendering scale.
  - type: textarea
    id: attachments
    attributes:
      label: Logs and screenshots
      description: Attach the relevant log or screenshot. Do not upload original game files.
